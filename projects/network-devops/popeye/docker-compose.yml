version: '3'
services:
  poll:
    build: ./poll
    restart: always
    environment:
      - HOST:0.0.0.0
    ports:
      - "5000:80"
    networks:
      - poll-tier
    depends_on:
      - redis
  result:
    build: ./result
    restart: always
    environment:
      - HOST:0.0.0.0
    ports:
      - "5001:80"
    networks:
      - result-tier
    depends_on:
      - db
  worker:
    build: ./worker
    restart: always
    environment:
      - HOST:0.0.0.0
    networks:
      - back-tier
    depends_on:
      - redis
      - db
    links:
      - redis
      - db
  db:
    image: postgres:9.4
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - "./shema.sql:/docker-entrypoint-initdb.d/schema.sql"
    networks:
      - back-tier
      - result-tier
    ports:
      - "5432:5432"
  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - poll-tier
      - back-tier
networks:
  poll-tier:
  result-tier:
  back-tier:
volumes:
  db-data: